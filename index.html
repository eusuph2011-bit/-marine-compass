<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081523">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marine Compass">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Marine Compass</title>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
  <h1>Compass</h1>
  <div class="top-actions"><button class="icon-btn" id="fullscreenBtn" aria-label="Fullscreen">⛶</button><button class="icon-btn" id="moreBtn" aria-label="More">⋮</button></div>
</header>

<main>
<section class="compass-card">
  <div class="compass" id="compass">
    <svg class="dial" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="face" cx="50%" cy="48%">
          <stop offset="0" stop-color="#173452"/><stop offset=".7" stop-color="#0a2037"/><stop offset="1" stop-color="#061426"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="49" fill="#263848"/>
      <circle cx="50" cy="50" r="45.8" fill="url(#face)" stroke="#415466" stroke-width=".7"/>
      <g id="windArcs"></g>
      <g id="ticks"></g>
      <g id="degreeLabels"></g>
      <g class="cardinals" fill="#e5edf4" font-size="4.8" font-weight="700" text-anchor="middle">
        <text x="50" y="5.8">E</text><text x="95" y="51.7">S</text>
        <text x="50" y="97">W</text><text x="5" y="51.7">N</text>
        <text x="72.5" y="14.2">SE</text><text x="85.7" y="84">SW</text>
        <text x="27.5" y="84">NW</text><text x="14.3" y="14.2">NE</text>
      </g>
    </svg>

    <div class="heading-readout"><span>HDG</span><strong id="hdg">88</strong></div>

    <div class="metric left-top"><span id="leftTopLabel">DEPTH</span><strong id="depth">3.2</strong></div>
    <div class="metric right-top"><span id="rightTopLabel">SOG</span><strong id="sog">0.0</strong></div>
    <div class="metric left-bottom"><span id="leftBottomLabel">TWS</span><strong id="tws">12.5</strong></div>
    <div class="metric right-bottom"><span id="rightBottomLabel">SPEED</span><strong id="speed">0.0</strong></div>

    <div class="boat"><div class="boat-line"></div></div>
    <div class="vector true-wind" id="trueWind" title="True wind"></div>
    <div class="vector apparent-wind" id="apparentWind" title="Apparent wind"></div>
    <div class="current-vector" id="currentVector" title="Current"></div>
    <div class="waypoint" id="waypoint" title="Waypoint">◆</div>
  </div>

  <div class="status" id="status">Demo heading: 88°</div>

  <div class="controls">
    <button id="sensorBtn">🧭 Enable iPhone Compass</button>
    <button id="gpsBtn">📍 Enable GPS</button>
    <button id="demoBtn">▶ Demo</button>
  </div>
</section>

<section class="panel" id="panel">
  <h2>Navigation data</h2>
  <div class="grid">
    <label>Heading <input id="headingInput" type="number" min="0" max="359" step="1" value="88"></label>
    <label>Depth <input id="depthInput" type="number" step=".1" value="3.2"></label>
    <label>SOG <input id="sogInput" type="number" step=".1" value="0"></label>
    <label>TWS <input id="twsInput" type="number" step=".1" value="12.5"></label>
    <label>Speed <input id="speedInput" type="number" step=".1" value="0"></label>
    <label>Wind angle <input id="windInput" type="number" min="-180" max="180" step="1" value="90"></label>
    <label>Current direction <input id="currentDirInput" type="number" min="0" max="359" step="1" value="0"></label>
    <label>Current speed <input id="currentSpeedInput" type="number" min="0" step=".1" value="0"></label>
    <label>Waypoint bearing <input id="waypointInput" type="number" min="0" max="359" step="1" value="0"></label>
  </div>
</section>

<section class="panel info">
  <h2>Connection</h2>
  <p id="gpsInfo">GPS: waiting for permission</p>
  <p>Sensor data stays in this browser. NMEA/Signal K integration can be added later through a local WebSocket or bridge.</p>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
