<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#041019"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Marine Nav V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#041019;color:#eef8ff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:620px;margin:auto;padding:env(safe-area-inset-top) 12px 20px}header{height:58px;display:flex;justify-content:space-between;align-items:center}.title{font-weight:800;letter-spacing:.12em}.status{font-size:11px;color:#86a6b5}.live{color:#6de0a7}.top{text-align:center}.heading{font-size:54px;font-weight:800}.sub{color:#91adbc;font-weight:650}.compass{position:relative;width:min(94vw,540px);aspect-ratio:1;margin:8px auto;border-radius:50%;background:radial-gradient(circle,#102c3d 0 57%,#061923 58%);border:2px solid #466c7f;box-shadow:0 0 0 7px #071721,0 0 0 9px #315364;overflow:hidden}.layer{position:absolute;inset:0;transition:transform .12s linear}.ring{inset:6%;border:1px solid #7393a2;border-radius:50%}.tick{position:absolute;left:50%;top:3%;height:7%;width:2px;background:#c3d6df;transform-origin:50% 671%}.minor{height:4%;width:1px;opacity:.65}.labels{inset:10%}.labels b{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:22px}.labels .e{left:auto;right:0;top:50%;transform:translateY(-50%)}.labels .s{top:auto;bottom:0}.labels .w{left:0;top:50%;transform:translateY(-50%)}.ship{position:absolute;left:50%;top:50%}.ship:before{content:"";position:absolute;left:-4px;top:-38px;width:8px;height:76px;background:#fff;border-radius:5px}.ship:after{content:"";position:absolute;left:-8px;top:-41px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:15px solid #fff}.arrow{position:absolute;left:50%;top:4%;width:0;height:46%;transform-origin:50% 100%;z-index:6;display:none}.arrow:after{content:"";position:absolute;left:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid #ffd84d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{background:#08202d;border:1px solid #2a5061;border-radius:11px;padding:8px 11px;min-height:61px}.lab{font-size:10px;color:#7895a4;letter-spacing:.13em}.val{font-size:18px;font-weight:750;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiny{font-size:13px}.controls,.settings,.modes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}button,input{width:100%;border:1px solid #31596b;background:#08202d;color:#eef8ff;border-radius:11px;padding:12px;font-size:14px}button{font-weight:750}.danger{border-color:#b45c5c}.active{outline:2px solid #5aaac5}.hint{text-align:center;color:#668492;font-size:10px;margin:8px}
</style></head><body><div class="app"><header><div class="title">MARINE NAV V2</div><div id="status" class="status">READY</div></header><div class="top"><div id="heading" class="heading">000°</div><div id="dir" class="sub">N • MAGNETIC</div></div><div class="compass"><div id="ring" class="layer ring"></div><div id="ticks" class="layer"></div><div id="labels" class="layer labels"><b>N</b><b class="e">E</b><b class="s">S</b><b class="w">W</b></div><div id="wpArrow" class="arrow"></div><div class="ship"></div></div><div class="grid"><div class="box"><div class="lab">SOG</div><div id="sog" class="val">-- kn</div></div><div class="box"><div class="lab">COG</div><div id="cog" class="val">--°</div></div><div class="box"><div class="lab">GPS ACCURACY</div><div id="acc" class="val">-- m</div></div><div class="box"><div class="lab">WAYPOINT</div><div id="wp" class="val">--</div></div><div class="box"><div class="lab">POSITION</div><div id="pos" class="val tiny">--</div></div><div class="box"><div class="lab">MOB</div><div id="mob" class="val tiny">NOT SET</div></div></div><div class="controls"><button id="enable">ENABLE COMPASS + GPS</button><button id="cal">CALIBRATE</button><button id="mobBtn" class="danger">MAN OVERBOARD</button><button id="clearMob">CLEAR MOB</button></div><div class="modes"><button id="mag" class="active">MAGNETIC</button><button id="tru">TRUE NORTH</button></div><div class="settings"><input id="lat" inputmode="decimal" placeholder="Waypoint latitude"><input id="lon" inputmode="decimal" placeholder="Waypoint longitude"><input id="decl" inputmode="decimal" placeholder="Declination ° (True−Mag)"><button id="setWp">SET WAYPOINT</button></div><div class="hint">Keep iPhone flat and away from magnets. True North requires a local declination value.</div></div><script>
const $=id=>document.getElementById(id),norm=x=>(x%360+360)%360;let heading=0,lastPos=null,trueMode=false,decl=0,mobPos=null;for(let i=0;i<36;i++){let t=document.createElement("i");t.className="tick "+(i%3?"minor":"");t.style.transform="rotate("+(i*10)+"deg)";$("ticks").appendChild(t)}function card(x){return["N","NE","E","SE","S","SW","W","NW"][Math.round(norm(x)/45)%8]}function show(h){heading=norm(h);$("heading").textContent=String(Math.round(heading)).padStart(3,"0")+"°";$("dir").textContent=card(heading)+" • "+(trueMode?"TRUE":"MAGNETIC");let r=-heading;for(let id of["ring","ticks","labels"])$(id).style.transform="rotate("+r+"deg)";updateArrow()}function bearing(a,b,c,d){let r=Math.PI/180,y1=a*r,y2=c*r,dy=(d-b)*r;return norm(Math.atan2(Math.sin(dy)*Math.cos(y2),Math.cos(y1)*Math.sin(y2)-Math.sin(y1)*Math.cos(y2)*Math.cos(dy))/r)}function dist(a,b,c,d){let R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function updateArrow(){if(!lastPos)return;let a=parseFloat($("lat").value),b=parseFloat($("lon").value);if(!isFinite(a)||!isFinite(b)){$("wpArrow").style.display="none";$("wp").textContent="--";return}let br=bearing(lastPos.lat,lastPos.lon,a,b),d=dist(lastPos.lat,lastPos.lon,a,b);$("wpArrow").style.display="block";$("wpArrow").style.transform="rotate("+norm(br-heading)+"deg)";$("wp").textContent=Math.round(br)+"° / "+(d<1000?Math.round(d)+" m":(d/1852).toFixed(2)+" NM")}function gps(p){let c=p.coords;lastPos={lat:c.latitude,lon:c.longitude};$("pos").textContent=c.latitude.toFixed(5)+" "+c.longitude.toFixed(5);$("acc").textContent=Math.round(c.accuracy)+" m";if(c.speed!=null&&c.speed>=0)$("sog").textContent=(c.speed*1.943844).toFixed(1)+" kn";if(c.heading!=null&&!isNaN(c.heading)&&c.speed>.8)$("cog").textContent=Math.round(c.heading)+"°";updateArrow();if(mobPos){let d=dist(mobPos.lat,mobPos.lon,lastPos.lat,lastPos.lon);$("mob").textContent=d<1000?Math.round(d)+" m away":(d/1852).toFixed(2)+" NM away"}}function motion(e){let h=null;if(typeof e.webkitCompassHeading==="number")h=e.webkitCompassHeading;else if(e.absolute&&typeof e.alpha==="number")h=360-e.alpha;if(h!=null)show(trueMode?h+decl:h)}async function enable(){try{if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){let p=await DeviceOrientationEvent.requestPermission();if(p!=="granted")throw 0}window.addEventListener("deviceorientationabsolute",motion,true);window.addEventListener("deviceorientation",motion,true);navigator.geolocation.watchPosition(gps,()=>{}, {enableHighAccuracy:true,maximumAge:1000,timeout:15000});$("status").textContent="LIVE";$("status").className="status live"}catch(e){$("status").textContent="PERMISSION NEEDED"}}$("enable").onclick=enable;$("cal").onclick=()=>{$("status").textContent="CALIBRATE: SLOW ROTATION"};$("setWp").onclick=updateArrow;$("mag").onclick=()=>{trueMode=false;$("mag").classList.add("active");$("tru").classList.remove("active");show(heading-decl)};$("tru").onclick=()=>{trueMode=true;$("tru").classList.add("active");$("mag").classList.remove("active");show(heading+decl)};$("decl").oninput=e=>decl=parseFloat(e.target.value)||0;$("mobBtn").onclick=()=>{if(lastPos){mobPos={...lastPos};$("mob").textContent="0 m"}};$("clearMob").onclick=()=>{mobPos=null;$("mob").textContent="NOT SET"};</script></body></html>
